<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login</title>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/css/materialize.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <script defer src="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/js/materialize.min.js"></script>
</head>
<body>
  <div class="container">
    <div class="row">
      <div class="col s12 m6 offset-m3">
        <h2 class="center-align">Login</h2>
        <form id="login-form">
          <div class="input-field">
            <input type="email" id="email" class="validate" autocomplete="email" required />
            <label for="email">Email</label>
          </div>
          <div class="input-field">
            <input type="password" id="password" class="validate" autocomplete="current-password" required />
            <label for="password">Password</label>
          </div>
          <div class="center-align">
            <button type="submit" class="btn waves-effect waves-light">Login</button>
          </div>
        </form>
        <p class="center-align">Don't have an account? <a href="signup.html">Sign up here</a></p>
      </div>
    </div>
  </div>
  <script type="module" src="js/login.js"></script>
</body>
</html>
